# 로컬 개발용 MySQL. `docker compose up -d --wait`로 띄운다(접속 준비가 끝날 때까지 기다린다). 계정·비밀번호는 내 컴퓨터에서만 쓰는 값이다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mwt
      MYSQL_USER: mwt
      MYSQL_PASSWORD: mwt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"   # 내 컴퓨터에서만 접속(같은 와이파이의 다른 사람은 못 붙게)
    volumes:
      - mysql-data:/var/lib/mysql
    # 처음 띄울 때는 데이터 폴더를 만드느라 접속을 받기까지 10~30초 걸린다. TCP로 ping이 되면 준비된 것으로 본다
    # (초기화 중 임시 서버는 네트워크를 열지 않아 127.0.0.1로는 응답하지 않는다).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
