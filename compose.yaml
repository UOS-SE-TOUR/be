# 로컬 개발용 MySQL. `docker compose up -d`로 띄운다. 계정·비밀번호는 내 컴퓨터에서만 쓰는 값이다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mwt
      MYSQL_USER: mwt
      MYSQL_PASSWORD: mwt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
