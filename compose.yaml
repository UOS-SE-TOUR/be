# 로컬 개발용 MySQL. `docker compose up -d`로 띄운다. 계정·비밀번호는 내 컴퓨터에서만 쓰는 값이다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mwt
      MYSQL_USER: mwt
      MYSQL_PASSWORD: mwt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"   # 내 컴퓨터에서만 접속(같은 와이파이의 다른 사람은 못 붙게)
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
