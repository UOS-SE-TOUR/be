spring:
  application:
    name: tour-server
  config:
    import: optional:file:.env[.properties]   # 레포 맨 위의 .env가 있으면 읽는다(Java properties 문법 — README 환경변수 절)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mwt}
    username: ${DB_USERNAME:mwt}
    password: ${DB_PASSWORD:mwt}
  jpa:
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 맞는지 확인만 한다
    open-in-view: false
