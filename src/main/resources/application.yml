spring:
  application:
    name: tour-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mwt}
    username: ${DB_USERNAME:mwt}
    password: ${DB_PASSWORD:mwt}
  jpa:
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 맞는지 확인만 한다
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false   # 정수 칸(기간·정원·인원·수량 등)에 2.5 같은 소수가 오면 잘라 받지 않고 400으로 돌려준다
    datatype:
      enum:
        fail-on-numbers-for-enums: true   # 테마·등급 자리에 숫자(0, "2")가 오면 순번으로 받지 않고 400으로 돌려준다
  autoconfigure:
    # 로그인은 JWT 쿠키로만 하므로 스프링 부트가 만드는 기본 계정(user와 임의 비밀번호)을 두지 않는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# API 문서(Swagger). 화면 호스팅·Nginx 프록시가 /api만 서버로 넘기므로 문서도 /api 아래에 둔다
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
  paths-to-match: /api/v1/**
  # 성공 응답의 본문 형식을 */* 대신 실제 형식(JSON)으로 적는다
  default-produces-media-type: application/json

# 솔라피 문자 발송(notification). 세 값이 모두 비어 있으면 문자를 보내지 않고 로그로만 남긴다
solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-number: ${SOLAPI_SENDER_NUMBER:}

# 로그인 토큰(JWT) 서명 키(common.security). 비어 있거나 32바이트보다 짧으면 서버가 뜨지 않는다.
# 이름을 jwt.secret으로 두지 않는다 — 그러면 셸에 export한 JWT_SECRET을 스프링이 바로 그 이름에 넣어 테스트용 키까지 덮는다
jwt:
  secret-key: ${JWT_SECRET:}

# 직원으로 가입할 때 입력하는 직원 코드(member). 비어 있으면 서버가 뜨지 않는다.
# 이름을 staff.code로 두지 않는다 — 위 jwt.secret-key와 같은 이유(셸에 export한 STAFF_CODE가 테스트용 값을 덮는다)
member:
  staff-code: ${STAFF_CODE:}

# 음성으로 고르기(voice)가 부르는 OpenAI API 키. 비어 있어도 서버는 뜨고, POST /api/v1/voice/parse만 503을 돌려준다.
# 이름을 openai.api-key로 두지 않는다 — 위 jwt.secret-key와 같은 이유(셸에 export한 OPENAI_API_KEY가 테스트의 빈 값을 덮는다)
voice:
  openai-api-key: ${OPENAI_API_KEY:}
