name: 운영 배포

# Actions 탭에서 "Run workflow" 버튼으로만 돈다. 운영 서버에 배포 버튼 키로 접속해 서버의 deploy/button.sh를 부른다.
# 그 키로 접속하면 button.sh만 돌아(서버 authorized_keys의 command=), 서버는 늘 main을 재배포하거나 결과만 보인다
# (README "버튼으로 재배포"). 레포에 쓰기 권한이 있는 팀원이면 누구나 누를 수 있고, 누른 사람은 실행 기록에 남는다.
# 필요한 값: Secrets DEPLOY_BUTTON_KEY(배포 버튼 키의 개인 키), Variables DEPLOY_HOST(서버 주소)·DEPLOY_KNOWN_HOSTS(서버 호스트 키 줄)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 할 일
        type: choice
        options:
          - 재배포
          - 결과 보기
        default: 재배포

permissions:
  contents: read

# 재배포끼리는 한 번에 하나만 돌고, 돌던 것을 취소하지 않는다(백업이나 컨테이너 교체 도중에 끊기지 않게).
# 결과 보기는 도는 재배포를 기다리지 않게 실행마다 따로 둔다
concurrency:
  group: ${{ inputs.action == '재배포' && 'production-deploy' || format('production-status-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 서버 빌드와 서버가 뜰 때까지의 확인(최대 3분)을 넉넉히 덮는다. 기본값 360분이면 접속이 멈췄을 때 무료 시간을 다 쓴다
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action }}
      DEPLOY_BUTTON_KEY: ${{ secrets.DEPLOY_BUTTON_KEY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: 값 확인
        run: |
          # 다시 실행(Re-run)하면 GITHUB_ACTOR는 처음 누른 사람 그대로라, 이번에 누른 사람을 따로 찍는다
          echo "누른 사람: $GITHUB_TRIGGERING_ACTOR (처음 실행한 사람: $GITHUB_ACTOR), 할 일: $ACTION"
          # 서버는 어느 브랜치에서 눌러도 main을 재배포한다. 다른 브랜치를 골랐으면 착각한 것이니 멈춘다.
          # 실수를 막는 검사일 뿐 보안 장치는 아니다 — 다른 브랜치의 워크플로는 이 검사를 뺄 수 있다(README "버튼으로 재배포")
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::버튼은 main에서 누릅니다(Run workflow의 Use workflow from에서 main을 고릅니다)"
            exit 1
          fi
          missing=
          [ -n "$DEPLOY_BUTTON_KEY" ] || missing="$missing Secrets:DEPLOY_BUTTON_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing Variables:DEPLOY_HOST"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing Variables:DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::레포 설정에 값이 없습니다:$missing (README \"버튼으로 재배포\"의 처음 한 번 설정)"
            exit 1
          fi

      - name: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            재배포) cmd=deploy ;;
            '결과 보기') cmd=status ;;
            *) echo "::error::모르는 할 일입니다: $ACTION"; exit 2 ;;
          esac
          key="$RUNNER_TEMP/deploy_button_key"
          # 취소나 시간 초과로 끊겨도 개인 키 파일을 지운다
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_BUTTON_KEY" > "$key")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          # 호스트 키는 미리 적어 둔 것만 믿는다(처음 보는 서버면 접속하지 않는다). 서버 계정은 Lightsail Ubuntu의 ubuntu다.
          # 빌드 중 스왑으로 서버가 느려져도 끊지 않게, 5분(30초×10) 동안 응답이 없을 때만 끊긴 것으로 본다
          set +e
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "ubuntu@$DEPLOY_HOST" "$cmd"
          rc=$?
          # 종료 코드의 뜻은 README "재배포"의 표와 같다
          case $rc in
            0) ;;
            1) echo "::error::배포가 멈췄습니다. 위 출력 끝에 \"띄우기 전에 멈췄습니다\"나 \"띄운 뒤에 멈췄습니다\"가 있으면 그 안내를 따릅니다(띄운 뒤면 README \"배포 되돌리기\"). 그런 문구가 없으면 시작 준비(임시 사본·잠금 파일)에서 실패해 아무것도 바꾸지 않은 것입니다" ;;
            2) echo "::error::서버가 시작하기 전에 거절했습니다(위 문구를 봅니다). 아무것도 바꾸지 않았습니다" ;;
            3) echo "::error::다른 배포나 백업 되살리기가 돌고 있어 아무것도 하지 않았습니다. 끝난 뒤 다시 누릅니다. 도는지는 \"결과 보기\"로 봅니다" ;;
            126 | 127) echo "::error::서버가 버튼 스크립트(deploy/button.sh)를 실행하지 못했습니다(없거나 실행 권한이 없음). 버튼 설정 뒤 서버를 아직 재배포하지 않았거나 그 스크립트가 없는 커밋으로 되돌린 것이니, 서버에서 재배포합니다(README \"버튼으로 재배포\")" ;;
            255) echo "::error::서버에 접속하지 못했거나(위 ssh 오류를 봅니다), 접속이 끊겼거나, 서버의 배포가 강제로 끝났습니다. \"결과 보기\"로 배포가 아직 도는지와 배포 기록을 봅니다. 돌고 있지 않은데 이번 배포의 기록이 없으면 강제로 끝난 것입니다" ;;
            *) echo "::error::종료 코드 $rc 로 끝났습니다. 위 출력을 봅니다" ;;
          esac
          exit $rc
