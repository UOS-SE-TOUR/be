name: 운영 이미지

# 운영 서버 이미지(Dockerfile)와 운영 Compose·배포 스크립트(deploy/)가 깨지지 않았는지 본다.
# 이미지 빌드는 몇 분 걸려서, 이미지나 운영 구성에 들어가는 파일이 바뀌었을 때만 돈다.
# 서버 코드(src/main)는 넣지 않는다 — 컴파일은 CI(ci.yml)의 ./gradlew build가 모든 PR에서 본다.
# 아래 두 paths 목록은 같게 둔다(PR과 main push가 같은 파일을 보게)
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - build.gradle
      - settings.gradle
      - gradle.properties
      - lombok.config
      - gradlew
      - gradle/**
      - buildSrc/**
      - deploy/**
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - build.gradle
      - settings.gradle
      - gradle.properties
      - lombok.config
      - gradlew
      - gradle/**
      - buildSrc/**
      - deploy/**
      - .github/workflows/image.yml

permissions:
  contents: read

# 같은 PR에 연달아 push하면 앞선 빌드는 취소한다(main push는 커밋마다 따로 돈다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - name: 운영 이미지 빌드
        run: docker build .
      # .env.example의 빈 값을 시험용 값으로 채워 넣는다. compose.yaml에 필수 값을 더하고 .env.example에 적지 않았으면 여기서 실패한다
      - name: 운영 Compose 확인
        # 이미지 빌드가 실패해도 이 확인은 돌려 두 결과를 함께 보인다(체크아웃이 실패했으면 돌리지 않는다)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          sed 's/^\([A-Z_][A-Z0-9_]*\)=[[:space:]]*$/\1=ci/' deploy/.env.example > "$RUNNER_TEMP/compose.env"
          docker compose -f deploy/compose.yaml --env-file "$RUNNER_TEMP/compose.env" config -q
      # 배포 스크립트의 문법과 흔한 셸 실수를 본다(러너에 shellcheck가 깔려 있다)
      - name: 배포 스크립트 확인
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: shellcheck deploy/deploy.sh
