name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에 연달아 push하면 앞선 빌드는 취소한다. main push는 커밋마다 따로 묶여 서로 취소하지 않는다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # DB 테스트는 Docker가 없으면 건너뛰도록 되어 있어서, CI에서는 Docker가 있는지 먼저 확인해 조용히 건너뛰는 일을 막는다
      - name: Docker 확인
        run: docker info
      - run: ./gradlew build
