name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에 연달아 push하면 앞선 빌드는 취소한다(main push는 커밋마다 따로 돈다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Docker가 없으면 DB 테스트가 건너뛰어지니 빌드 전에 먼저 확인한다
      - name: Docker 확인
        run: docker info
      - run: ./gradlew build
      # CI에서는 건너뛴 테스트를 허용하지 않는다(Testcontainers가 Docker에 못 붙으면 DB 테스트가 조용히 건너뛰어진다)
      - name: 건너뛴 테스트 확인
        run: |
          shopt -s nullglob
          results=(build/test-results/*/*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "테스트 결과 파일이 없다 — 테스트가 돌았는지 확인한다"
            exit 1
          fi
          if grep -l 'skipped="[1-9]' "${results[@]}"; then
            echo "위 테스트 결과에 건너뛴 테스트가 있다 — Docker를 못 찾은 DB 테스트이거나 @Disabled·assume으로 끈 테스트다"
            exit 1
          elif [ $? -ne 1 ]; then
            echo "테스트 결과 파일을 읽지 못했다"
            exit 1
          fi
